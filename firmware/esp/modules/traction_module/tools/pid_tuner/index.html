<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Traction PID Tuner</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #151b22;
      --accent: #4cc9f0;
      --muted: #7a8699;
      --text: #e6edf3;
    }
    body {
      margin: 0;
      font-family: "Fira Sans", Arial, sans-serif;
      background: radial-gradient(1200px 600px at 10% 10%, #1f2a37 0%, var(--bg) 60%);
      color: var(--text);
    }
    header {
      padding: 16px 20px;
      font-size: 20px;
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 16px;
      padding: 0 20px 20px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid #232b36;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    }
    canvas {
      width: 100%;
      height: 360px;
      background: #0b1116;
      border-radius: 10px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
    }
    .row label {
      width: 40px;
      color: var(--muted);
    }
    input[type="range"] {
      width: 100%;
    }
    input[type="number"] {
      width: 90px;
      background: #0b1116;
      color: var(--text);
      border: 1px solid #2a3340;
      border-radius: 6px;
      padding: 6px;
    }
    button {
      background: #1f2937;
      color: var(--text);
      border: 1px solid #2a3340;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      color: #071018;
      border-color: transparent;
      font-weight: 600;
    }
    .status {
      font-size: 13px;
      color: var(--muted);
    }
    .status.ok { color: #84cc16; }
    .status.err { color: #ef4444; }
    .log {
      background: #0b1116;
      border: 1px solid #232b36;
      border-radius: 8px;
      padding: 8px;
      height: 140px;
      overflow: auto;
      font-family: "Fira Mono", "Consolas", monospace;
      font-size: 12px;
      color: #c7d2fe;
      white-space: pre-wrap;
    }
    .value {
      font-size: 18px;
      font-weight: 600;
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    Traction PID Tuner (USB/Serial)
    <a href="../position_tuner/index.html" style="margin-left:12px; color:#4cc9f0; font-size:14px;">Position Page</a>
  </header>
  <div class="grid">
    <div class="panel">
      <canvas id="chart" width="800" height="360"></canvas>
      <div class="row">
        <div>Setpoint: <span class="value" id="spVal">0</span> rpm</div>
        <div style="margin-left:auto;">Speed: <span class="value" id="rpmVal">0</span> rpm</div>
      </div>
      <div class="row">
        <div>PID Output: <span class="value" id="outVal">0</span> %</div>
        <div style="margin-left:auto;">PID Raw: <span class="value" id="outRawVal">0</span> %</div>
      </div>
      <div class="row">
        <div style="margin-left:auto;" class="status">Output is not plotted</div>
      </div>
      <div class="row">
        <div class="status">PID: KP=<span id="kpLegend">0</span> KI=<span id="kiLegend">0</span> KD=<span id="kdLegend">0</span></div>
      </div>
      <div class="row">
        <label>SP</label>
        <input id="spSlider" type="range" min="-150" max="150" step="1" value="0">
        <input id="spInput" type="number" min="-150" max="150" step="1" value="0">
      </div>
    </div>
    <div class="panel">
      <div class="row">
        <button id="connectBtn" class="primary">Connect</button>
        <button id="getBtn">Read PID</button>
        <button id="saveBtn">Save</button>
      </div>
      <div class="row">
        <button id="startStopBtn" class="primary">START</button>
      </div>
      <div class="row">
        <button id="telemToggleBtn">Pause Telemetry</button>
      </div>
      <div class="status" id="status">Disconnected</div>
      <div class="status" id="cmdStatus">No commands</div>
      <hr style="border-color:#232b36; margin:12px 0;">
      <div class="row">
        <label>KP</label>
        <input id="kpSlider" type="range" min="0" max="100" step="0.01" value="1.00">
        <input id="kpInput" type="number" min="0" max="100" step="0.01" value="1.00">
      </div>
      <div class="row">
        <label>KI</label>
        <input id="kiSlider" type="range" min="0" max="100" step="0.01" value="2.20">
        <input id="kiInput" type="number" min="0" max="100" step="0.01" value="2.20">
      </div>
      <div class="row">
        <label>KD</label>
        <input id="kdSlider" type="range" min="0" max="100" step="0.01" value="0.00">
        <input id="kdInput" type="number" min="0" max="100" step="0.01" value="0.00">
      </div>
      <hr style="border-color:#232b36; margin:12px 0;">
      <div class="row">
        <label>OUT</label>
        <input id="outSlider" type="range" min="0" max="100" step="1" value="0">
        <input id="outInput" type="number" min="0" max="100" step="1" value="0">
      </div>
      <div class="row">
        <button id="outEnableBtn">Force Output</button>
        <button id="outClearBtn">Resume PID</button>
      </div>
      <hr style="border-color:#232b36; margin:12px 0;">
      <div class="row">
        <button id="captureBtn">Start Capture</button>
        <button id="clearCaptureBtn">Clear</button>
      </div>
      <div class="row">
        <button id="sweepBtn">Start Sweep</button>
        <button id="sweepStopBtn">Stop Sweep</button>
      </div>
      <div class="status" id="sweepStatus">Sweep: stopped</div>
      <div class="status">RPM vs Output Capture (%)</div>
      <canvas id="scatter" width="320" height="220" style="margin-top:8px;"></canvas>
      <div class="status" style="margin-top:8px;">Table (last 150)</div>
      <div id="tableWrap" class="log" style="height:160px; color:#e6edf3;"></div>
      <div class="row">
        <div class="status">ESP32-C3 Log</div>
        <button id="logClearBtn" style="margin-left:auto;">Clear Log</button>
      </div>
      <div id="log" class="log"></div>
      <div class="status">Chart update: 30 Hz</div>
    </div>
  </div>

  <script>
    const chart = document.getElementById("chart");
    const ctx = chart.getContext("2d");
    const spVal = document.getElementById("spVal");
    const rpmVal = document.getElementById("rpmVal");
    const statusEl = document.getElementById("status");
    const outVal = document.getElementById("outVal");
    const outRawVal = document.getElementById("outRawVal");
    const kpLegend = document.getElementById("kpLegend");
    const kiLegend = document.getElementById("kiLegend");
    const kdLegend = document.getElementById("kdLegend");
    const logEl = document.getElementById("log");
    const cmdStatusEl = document.getElementById("cmdStatus");
    const scatter = document.getElementById("scatter");
    const scatterCtx = scatter.getContext("2d");
    const captureBtn = document.getElementById("captureBtn");
    const clearCaptureBtn = document.getElementById("clearCaptureBtn");
    const sweepBtn = document.getElementById("sweepBtn");
    const sweepStopBtn = document.getElementById("sweepStopBtn");
    const sweepStatus = document.getElementById("sweepStatus");
    const tableWrap = document.getElementById("tableWrap");
    let lastRxAt = 0;
    const connectBtn = document.getElementById("connectBtn");
    const getBtn = document.getElementById("getBtn");
    const saveBtn = document.getElementById("saveBtn");
    const startStopBtn = document.getElementById("startStopBtn");

    const spSlider = document.getElementById("spSlider");
    const spInput = document.getElementById("spInput");
    const kpSlider = document.getElementById("kpSlider");
    const kpInput = document.getElementById("kpInput");
    const kiSlider = document.getElementById("kiSlider");
    const kiInput = document.getElementById("kiInput");
    const kdSlider = document.getElementById("kdSlider");
    const kdInput = document.getElementById("kdInput");
    const outSlider = document.getElementById("outSlider");
    const outInput = document.getElementById("outInput");
    const outEnableBtn = document.getElementById("outEnableBtn");
    const outClearBtn = document.getElementById("outClearBtn");
    const logClearBtn = document.getElementById("logClearBtn");
    const telemToggleBtn = document.getElementById("telemToggleBtn");

    let port = null;
    let reader = null;
    let writer = null;
    let buffer = "";
    let closingSerial = false;
    let connectingSerial = false;
    let telemTimer = null;
    let telemEnabled = true;
    let captureOn = false;
    let captureStartMs = 0;
    const capture = [];
    let sweepTimer = null;
    const sweep = {
      active: false,
      out: 0.0,
      step: 1.0,
      waitMs: 1000,
      nextSampleAt: 0,
      awaitingSample: false,
    };

    const MAX_POINTS = 600;
    const MAX_CAPTURE = 2000;
    const MAX_TABLE_ROWS = 150;
    const RX_TIMEOUT_MS = 3000;
    const RX_WATCHDOG_MS = 1000;
    const TELEM_INTERVAL_MS = 33;
    const SAVE_TELEM_PAUSE_MS = 1000;
    const SWEEP_POLL_MS = 50;
    const START_STOP_SP_START = 150;
    const START_STOP_SP_STOP = 0;
    const START_STOP_THRESHOLD_RPM = 10;
    const data = [];

    function drawChart() {
      const w = chart.width;
      const h = chart.height;
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = "#263241";
      ctx.lineWidth = 1;
      for (let i = 1; i < 5; i++) {
        const y = (h / 5) * i;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }

      if (data.length < 2) return;
      const sp = data[data.length - 1].sp;
      const rpm = data[data.length - 1].rpm;
      const out = data[data.length - 1].out;
      const outRaw = data[data.length - 1].outRaw;
      spVal.textContent = sp.toFixed(1);
      rpmVal.textContent = rpm.toFixed(1);
      outVal.textContent = out.toFixed(1);
      if (Number.isFinite(outRaw)) {
        outRawVal.textContent = outRaw.toFixed(1);
      }

      const minY = -300;
      const maxY = 300;
      const range = maxY - minY;

      function yScale(v) {
        return h - ((v - minY) / range) * h;
      }

      ctx.strokeStyle = "#4cc9f0";
      ctx.lineWidth = 2;
      ctx.beginPath();
      data.forEach((p, i) => {
        const x = (i / (MAX_POINTS - 1)) * w;
        const y = yScale(p.rpm);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      ctx.strokeStyle = "#fca311";
      ctx.lineWidth = 2;
      ctx.beginPath();
      data.forEach((p, i) => {
        const x = (i / (MAX_POINTS - 1)) * w;
        const y = yScale(p.sp);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    function drawScatter() {
      const w = scatter.width;
      const h = scatter.height;
      scatterCtx.clearRect(0, 0, w, h);
      scatterCtx.fillStyle = "#0b1116";
      scatterCtx.fillRect(0, 0, w, h);
      scatterCtx.strokeStyle = "#263241";
      scatterCtx.lineWidth = 1;
      for (let i = 1; i < 4; i++) {
        const x = (w / 4) * i;
        const y = (h / 4) * i;
        scatterCtx.beginPath();
        scatterCtx.moveTo(x, 0);
        scatterCtx.lineTo(x, h);
        scatterCtx.stroke();
        scatterCtx.beginPath();
        scatterCtx.moveTo(0, y);
        scatterCtx.lineTo(w, y);
        scatterCtx.stroke();
      }

      const xMin = 0;
      const xMax = 100;
      const yMin = -250;
      const yMax = 250;

      function sx(v) {
        return ((v - xMin) / (xMax - xMin)) * w;
      }
      function sy(v) {
        return h - ((v - yMin) / (yMax - yMin)) * h;
      }

      scatterCtx.fillStyle = "#4cc9f0";
      for (const p of capture) {
        const x = sx(p.out);
        const y = sy(p.rpm);
        scatterCtx.fillRect(x - 1, y - 1, 2, 2);
      }
    }

    function updateTable() {
      if (!tableWrap) return;
      const rows = capture.slice(-MAX_TABLE_ROWS).map((p) =>
        `${p.t.toFixed(2)}s  rpm=${p.rpm.toFixed(2)}  out=${p.out.toFixed(2)}  sp=${p.sp.toFixed(2)}`
      );
      tableWrap.textContent = rows.join("\n");
      tableWrap.scrollTop = tableWrap.scrollHeight;
    }

    function appendData(sp, rpm, out, outRaw) {
      data.push({ sp, rpm, out, outRaw });
      if (data.length > MAX_POINTS) data.shift();
      drawChart();
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }
    function setCmdStatus(text, ok = true) {
      if (!cmdStatusEl) return;
      cmdStatusEl.textContent = text;
      cmdStatusEl.classList.toggle("ok", ok);
      cmdStatusEl.classList.toggle("err", !ok);
    }

    function setConnectionState(connected) {
      setStatus(connected ? "Connected" : "Disconnected");
      connectBtn.textContent = connected ? "Disconnect" : "Connect";
      appendLog(connected ? "PORT: connected" : "PORT: disconnected");
    }

    function fmtTime(ts) {
      const d = new Date(ts);
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      const ss = String(d.getSeconds()).padStart(2, "0");
      const ms = String(d.getMilliseconds()).padStart(3, "0");
      return `${hh}:${mm}:${ss}.${ms}`;
    }

    function appendLog(line) {
      if (!logEl) return;
      logEl.textContent += `[${fmtTime(Date.now())}] ${line}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function delayMs(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function releaseSerialHandlesForUnload() {
      stopTelem();
      stopSweep(false);
      buffer = "";

      if (reader) {
        try {
          void reader.cancel();
        } catch (_err) {
          // ignore
        }
        try {
          reader.releaseLock();
        } catch (_err) {
          // ignore
        }
        reader = null;
      }

      if (writer) {
        try {
          writer.releaseLock();
        } catch (_err) {
          // ignore
        }
        writer = null;
      }

      if (port) {
        const openedPort = port;
        port = null;
        try {
          void openedPort.close();
        } catch (_err) {
          // ignore
        }
      }
      connectBtn.textContent = "Connect";
      statusEl.textContent = "Disconnected";
    }

    async function closeSerial(options = {}) {
      const { logDisconnect = true, reportErrors = true } = options;
      if (closingSerial) return;
      if (!port && !reader && !writer) {
        if (logDisconnect && statusEl.textContent !== "Disconnected") {
          setConnectionState(false);
        }
        return;
      }
      closingSerial = true;
      connectingSerial = false;

      try {
        stopTelem();
        stopSweep(false);
        buffer = "";

        if (reader) {
          try {
            await reader.cancel();
          } catch (_err) {
            // ignore: cancel may fail if stream is already closed/disconnected
          }
          try {
            reader.releaseLock();
          } catch (_err) {
            // ignore: lock may already be released
          }
          reader = null;
        }

        if (writer) {
          try {
            writer.releaseLock();
          } catch (_err) {
            // ignore: lock may already be released
          }
          writer = null;
        }

        if (port) {
          const openedPort = port;
          port = null;
          try {
            await openedPort.close();
          } catch (err) {
            if (reportErrors) {
              setStatus("Error: " + (err && err.message ? err.message : err));
              appendLog("Error: " + (err && err.message ? err.message : err));
            }
          }
        }

        if (logDisconnect) {
          setConnectionState(false);
        } else {
          setStatus("Disconnected");
          connectBtn.textContent = "Connect";
        }
      } finally {
        closingSerial = false;
      }
    }

    async function connect(useChooser = true, options = {}) {
      const { reportErrors = true, openRetries = 1 } = options;
      if (connectingSerial || closingSerial) return;
      connectingSerial = true;
      try {
        if (!("serial" in navigator)) {
          setStatus("Web Serial not supported");
          return;
        }
        if (useChooser) {
          port = await navigator.serial.requestPort();
        } else {
          const ports = await navigator.serial.getPorts();
          if (!ports.length) {
            setStatus("No paired ports");
            return;
          }
          port = ports[0];
        }
        let lastOpenErr = null;
        for (let attempt = 0; attempt < openRetries; attempt++) {
          try {
            await port.open({ baudRate: 115200 });
            lastOpenErr = null;
            break;
          } catch (err) {
            lastOpenErr = err;
            if (attempt + 1 < openRetries) {
              await delayMs(200);
            }
          }
        }
        if (lastOpenErr) throw lastOpenErr;
        reader = port.readable.getReader();
        writer = port.writable.getWriter();
        setConnectionState(true);
        lastRxAt = Date.now();
        void readLoop();
        sendLine("GET PID RPM");
        stopTelem();
        if (telemEnabled) startTelem();
      } catch (err) {
        if (reportErrors) {
          setStatus("Error: " + (err && err.message ? err.message : err));
          appendLog("Error: " + (err && err.message ? err.message : err));
        }
        await closeSerial({ logDisconnect: false, reportErrors: false });
      } finally {
        connectingSerial = false;
      }
    }

    async function disconnect() {
      await closeSerial({ logDisconnect: true, reportErrors: true });
    }

    async function readLoop() {
      try {
        while (true) {
          if (!reader) break;
          const { value, done } = await reader.read();
          if (done) break;
          const chunk = new TextDecoder().decode(value);
          if (chunk && chunk.length) {
            lastRxAt = Date.now();
          }
          buffer += chunk;
          let idx;
          while ((idx = buffer.search(/[\r\n]/)) >= 0) {
            const line = buffer.slice(0, idx).trim();
            buffer = buffer.slice(idx + 1);
            if (line.length > 0) handleLine(line);
          }
        }
      } catch (err) {
        if (!closingSerial) {
          appendLog("RX ERROR: " + (err && err.message ? err.message : err));
        }
      } finally {
        if (!closingSerial && (port || reader || writer)) {
          await closeSerial({ logDisconnect: true, reportErrors: false });
        }
      }
    }

    function pushCapturePoint(t, rpm, out, sp) {
      capture.push({ t, rpm, out, sp });
      if (capture.length > MAX_CAPTURE) capture.shift();
      drawScatter();
      updateTable();
    }

    function handleTelemLine(parts) {
      if (parts.length < 4) return;
      const sp = parseFloat(parts[1]);
      const rpm = parseFloat(parts[2]);
      const out = parseFloat(parts[3]);
      const outRawParsed = parseFloat(parts[4]);
      const outRaw = Number.isFinite(outRawParsed) ? outRawParsed : out;

      appendData(sp, rpm, out, outRaw);
      if (!(captureOn || sweep.active) || !Number.isFinite(out) || !Number.isFinite(rpm)) return;

      const t = (Date.now() - captureStartMs) / 1000;
      if (sweep.active && sweep.awaitingSample) {
        pushCapturePoint(t, rpm, out, sp);
        sweep.awaitingSample = false;
        advanceSweep();
        return;
      }

      if (captureOn) {
        pushCapturePoint(t, rpm, out, sp);
      }
    }

    function handlePidLine(parts) {
      if (parts.length < 5) return;
      setValue(kpSlider, kpInput, parts[1]);
      setValue(kiSlider, kiInput, parts[2]);
      setValue(kdSlider, kdInput, parts[3]);
      setValue(spSlider, spInput, parts[4]);
      updateStartStopButton(parseFloat(parts[4]));
      kpLegend.textContent = String(parts[1]).trim();
      kiLegend.textContent = String(parts[2]).trim();
      kdLegend.textContent = String(parts[3]).trim();
    }

    function handleLine(line) {
      const isTelem = line.startsWith("T,");
      if (!isTelem) appendLog("<< " + line);

      if (line === "OK") {
        setCmdStatus("OK", true);
        return;
      }
      if (line === "ERR") {
        setCmdStatus("ERR", false);
        return;
      }
      if (line.startsWith("S,OK")) {
        setCmdStatus("NVS saved", true);
        return;
      }
      if (line.startsWith("S,ERR")) {
        setCmdStatus("NVS Error: " + line, false);
        return;
      }
      if (isTelem) {
        handleTelemLine(line.split(","));
        return;
      }
      if (line.startsWith("P,")) {
        handlePidLine(line.split(","));
      }
    }

    function setValue(slider, input, val) {
      const raw = String(val).trim();
      const v = parseFloat(raw);
      if (Number.isFinite(v)) {
        slider.value = v;
        input.value = raw;
      }
    }

    function sendLine(text) {
      if (!writer) return;
      const data = new TextEncoder().encode(text + "\n");
      writer.write(data);
    }

    function bindClick(el, handler) {
      if (!el) return false;
      el.addEventListener("click", handler);
      return true;
    }

    function isRunningSetpoint(sp) {
      return Number.isFinite(sp) && (sp >= START_STOP_THRESHOLD_RPM || sp <= -START_STOP_THRESHOLD_RPM);
    }

    function updateStartStopButton(sp) {
      if (!startStopBtn) return;
      startStopBtn.textContent = isRunningSetpoint(sp) ? "STOP" : "START";
    }

    function setSetpointFromStartStop(nextSp) {
      setValue(spSlider, spInput, nextSp);
      sendLine("SET PID RPM SP " + nextSp);
      updateStartStopButton(nextSp);
    }

    function bindPair(slider, input, cmd) {
      if (!slider || !input) return;
      let lastSent = 0;
      function send(v) {
        const now = Date.now();
        if (now - lastSent < 100) return;
        lastSent = now;
        sendLine(cmd + " " + v);
      }
      slider.addEventListener("input", () => {
        input.value = slider.value;
        send(slider.value);
      });
      input.addEventListener("change", () => {
        slider.value = input.value;
        input.value = slider.value;
        send(slider.value);
      });
    }

    bindClick(connectBtn, () => {
      if (port) {
        disconnect();
      } else {
        connect(true);
      }
    });
    bindClick(getBtn, () => sendLine("GET PID RPM"));
    function pauseTelemForSave() {
      stopTelem();
      setTimeout(() => {
        if (telemEnabled) {
          startTelem();
        }
      }, SAVE_TELEM_PAUSE_MS);
    }

    bindClick(saveBtn, () => {
      sendLine("SAVE PID RPM");
      pauseTelemForSave();
    });

    bindClick(startStopBtn, () => {
      const currentSp = parseFloat(spInput.value);
      if (isRunningSetpoint(currentSp)) {
        setSetpointFromStartStop(START_STOP_SP_STOP);
      } else {
        setSetpointFromStartStop(START_STOP_SP_START);
      }
    });

    function stopTelem() {
      if (telemTimer) {
        clearInterval(telemTimer);
        telemTimer = null;
      }
    }

    function startTelem() {
      if (!writer || telemTimer) return;
      sendLine("GET TELEM");
      telemTimer = setInterval(() => {
        if (writer) sendLine("GET TELEM");
      }, TELEM_INTERVAL_MS);
    }

    bindClick(telemToggleBtn, () => {
      telemEnabled = !telemEnabled;
      if (telemEnabled) {
        telemToggleBtn.textContent = "Pause Telemetry";
        startTelem();
      } else {
        telemToggleBtn.textContent = "Start Telemetry";
        stopTelem();
      }
    });

    bindClick(logClearBtn, () => {
      if (logEl) logEl.textContent = "";
    });

    bindPair(kpSlider, kpInput, "SET PID RPM KP");
    bindPair(kiSlider, kiInput, "SET PID RPM KI");
    bindPair(kdSlider, kdInput, "SET PID RPM KD");
    bindPair(spSlider, spInput, "SET PID RPM SP");
    if (spSlider) {
      spSlider.addEventListener("input", () => updateStartStopButton(parseFloat(spSlider.value)));
    }
    if (spInput) {
      spInput.addEventListener("change", () => updateStartStopButton(parseFloat(spInput.value)));
      updateStartStopButton(parseFloat(spInput.value));
    }

    bindClick(outEnableBtn, () => {
      sendLine("SET OUT " + outSlider.value);
    });
    bindClick(outClearBtn, () => {
      sendLine("CLR OUT");
    });
    if (outSlider && outInput) {
      outSlider.addEventListener("input", () => {
        outInput.value = outSlider.value;
      });
      outInput.addEventListener("change", () => {
        outSlider.value = outInput.value;
      });
    }

    bindClick(captureBtn, () => {
      captureOn = !captureOn;
      if (captureOn) {
        captureStartMs = Date.now();
        captureBtn.textContent = "Stop Capture";
      } else {
        captureBtn.textContent = "Start Capture";
      }
    });
    bindClick(clearCaptureBtn, () => {
      capture.length = 0;
      drawScatter();
      updateTable();
    });

    function updateSweepStatus() {
      if (!sweepStatus) return;
      if (!sweep.active) {
        sweepStatus.textContent = "Sweep: stopped";
      } else {
        sweepStatus.textContent = `Sweep: OUT=${sweep.out.toFixed(2)}%`;
      }
    }

    function advanceSweep() {
      sweep.out = Math.round((sweep.out + sweep.step) * 100) / 100;
      if (sweep.out > 100.0) {
        stopSweep(true);
        return;
      }
      sendLine("SET OUT " + sweep.out.toFixed(2));
      sweep.nextSampleAt = Date.now() + sweep.waitMs;
      sweep.awaitingSample = false;
      updateSweepStatus();
    }

    function startSweep() {
      if (sweep.active) return;
      capture.length = 0;
      drawScatter();
      updateTable();
      captureStartMs = Date.now();
      sweep.active = true;
      sweep.out = 0.0;
      sweep.awaitingSample = false;
      sendLine("SET OUT 0");
      sweep.nextSampleAt = Date.now() + sweep.waitMs;
      updateSweepStatus();
      if (sweepTimer) clearInterval(sweepTimer);
      sweepTimer = setInterval(() => {
        if (!sweep.active) return;
        if (Date.now() >= sweep.nextSampleAt) {
          // wait for next T sample
          sweep.awaitingSample = true;
        }
      }, SWEEP_POLL_MS);
    }

    function stopSweep(clearOut) {
      sweep.active = false;
      sweep.awaitingSample = false;
      if (sweepTimer) {
        clearInterval(sweepTimer);
        sweepTimer = null;
      }
      updateSweepStatus();
      if (clearOut) {
        sendLine("CLR OUT");
      }
    }

    bindClick(sweepBtn, startSweep);
    bindClick(sweepStopBtn, () => stopSweep(true));

    if ("serial" in navigator) {
      navigator.serial.addEventListener("disconnect", () => {
        void closeSerial({ logDisconnect: true, reportErrors: false });
      });
      setInterval(() => {
        if (port && Date.now() - lastRxAt > RX_TIMEOUT_MS) {
          setCmdStatus("No RX (check COM port)", false);
        }
      }, RX_WATCHDOG_MS);
      window.addEventListener("pagehide", () => {
        releaseSerialHandlesForUnload();
      });
      window.addEventListener("beforeunload", () => {
        releaseSerialHandlesForUnload();
      });
      window.addEventListener("unload", () => {
        releaseSerialHandlesForUnload();
      });
      // try auto-connect on a previously paired port
      void connect(false, { reportErrors: false, openRetries: 8 });
    }
  </script>
</body>
</html>
