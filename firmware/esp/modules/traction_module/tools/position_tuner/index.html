<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Traction Position Tuner</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #151b22;
      --accent: #4cc9f0;
      --muted: #7a8699;
      --text: #e6edf3;
    }
    body {
      margin: 0;
      font-family: "Fira Sans", Arial, sans-serif;
      background: radial-gradient(1200px 600px at 10% 10%, #1f2a37 0%, var(--bg) 60%);
      color: var(--text);
    }
    header {
      padding: 16px 20px;
      font-size: 20px;
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px;
      padding: 0 20px 20px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid #232b36;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    }
    canvas {
      width: 100%;
      height: 360px;
      background: #0b1116;
      border-radius: 10px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
    }
    .row label {
      width: 70px;
      color: var(--muted);
    }
    input[type="number"] {
      width: 110px;
      background: #0b1116;
      color: var(--text);
      border: 1px solid #2a3340;
      border-radius: 6px;
      padding: 6px;
    }
    select {
      width: 100%;
      background: #0b1116;
      color: var(--text);
      border: 1px solid #2a3340;
      border-radius: 6px;
      padding: 6px;
    }
    button {
      background: #1f2937;
      color: var(--text);
      border: 1px solid #2a3340;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      color: #071018;
      border-color: transparent;
      font-weight: 600;
    }
    .value {
      font-size: 18px;
      font-weight: 600;
    }
    .status {
      font-size: 13px;
      color: var(--muted);
    }
    .status.ok { color: #84cc16; }
    .status.err { color: #ef4444; }
    .log {
      background: #0b1116;
      border: 1px solid #232b36;
      border-radius: 8px;
      padding: 8px;
      height: 180px;
      overflow: auto;
      font-family: "Fira Mono", "Consolas", monospace;
      font-size: 12px;
      color: #c7d2fe;
      white-space: pre-wrap;
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    Traction Position Tuner (USB/Serial)
    <a href="../pid_tuner/index.html" style="margin-left:12px; color:#4cc9f0; font-size:14px;">Speed Page</a>
    <a href="../motor_config/index.html" style="margin-left:12px; color:#4cc9f0; font-size:14px;">Motor Config</a>
  </header>
  <div class="grid">
    <div class="panel">
      <canvas id="chart" width="900" height="360"></canvas>
      <div class="row">
        <div>Target: <span class="value" id="targetVal">0</span> deg</div>
        <div style="margin-left:auto;">Position: <span class="value" id="posVal">0</span> deg</div>
      </div>
      <div class="row">
        <div>Output PWM: <span class="value" id="outPwmVal">0</span> %</div>
        <div style="margin-left:auto;">Output Raw: <span class="value" id="outRawVal">0</span> %</div>
      </div>
      <div class="row">
        <div>Error: <span class="value" id="errVal">0</span> deg</div>
        <div style="margin-left:auto;" class="status" id="modeStatus">Mode: disabled</div>
      </div>
    </div>
    <div class="panel">
      <div class="row">
        <button id="connectBtn" class="primary">Connect</button>
        <button id="getBtn">Read POS PID</button>
        <button id="saveBtn">Save</button>
      </div>
      <div class="row">
        <button id="startBtn" class="primary">Start POS</button>
        <button id="stopBtn">Stop POS</button>
      </div>
      <div class="row">
        <div class="status">Telemetry running</div>
        <button id="clearLogBtn">Clear Log</button>
      </div>
      <div class="status" id="status">Disconnected</div>
      <div class="status" id="cmdStatus">No commands</div>
      <hr style="border-color:#232b36; margin:12px 0;">
      <div class="row">
        <label>KP</label>
        <input id="kpInput" type="number" step="0.01" value="4.00" />
      </div>
      <div class="row">
        <label>KI</label>
        <input id="kiInput" type="number" step="0.01" value="0.00" />
      </div>
      <div class="row">
        <label>KD</label>
        <input id="kdInput" type="number" step="0.01" value="0.10" />
      </div>
      <div class="row">
        <label>Angle</label>
        <input id="angleSlider" type="range" min="0" max="360" step="1" value="0" style="width:100%;" />
      </div>
      <div class="row">
        <label>Deg</label>
        <input id="angleInput" type="number" step="1" value="0" />
        <button id="setAngleBtn">Sync</button>
      </div>
      <hr style="border-color:#232b36; margin:12px 0;">
      <div class="row">
        <label>Amp (deg)</label>
        <input id="sineAmpInput" type="number" min="0" max="180" step="1" value="90" />
      </div>
      <div class="row">
        <label>Offset</label>
        <input id="sineOffsetInput" type="number" min="0" max="360" step="1" value="180" />
      </div>
      <div class="row">
        <label>Period s</label>
        <input id="sinePeriodInput" type="number" min="0.5" max="60" step="0.1" value="8.0" />
      </div>
      <div class="row">
        <button id="sineStartBtn">Start Sine</button>
        <button id="sineStopBtn">Stop Sine</button>
      </div>
      <div class="status" id="sineStatus">Sine: stopped</div>
      <div class="row">
        <div class="status">ESP32-C3 Log</div>
      </div>
      <div id="log" class="log"></div>
    </div>
  </div>

  <script>
    const chart = document.getElementById("chart");
    const ctx = chart.getContext("2d");
    const targetVal = document.getElementById("targetVal");
    const posVal = document.getElementById("posVal");
    const outPwmVal = document.getElementById("outPwmVal");
    const outRawVal = document.getElementById("outRawVal");
    const errVal = document.getElementById("errVal");
    const modeStatus = document.getElementById("modeStatus");

    const connectBtn = document.getElementById("connectBtn");
    const getBtn = document.getElementById("getBtn");
    const saveBtn = document.getElementById("saveBtn");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const clearLogBtn = document.getElementById("clearLogBtn");
    const setAngleBtn = document.getElementById("setAngleBtn");
    const sineStartBtn = document.getElementById("sineStartBtn");
    const sineStopBtn = document.getElementById("sineStopBtn");

    const kpInput = document.getElementById("kpInput");
    const kiInput = document.getElementById("kiInput");
    const kdInput = document.getElementById("kdInput");
    const angleSlider = document.getElementById("angleSlider");
    const angleInput = document.getElementById("angleInput");
    const sineAmpInput = document.getElementById("sineAmpInput");
    const sineOffsetInput = document.getElementById("sineOffsetInput");
    const sinePeriodInput = document.getElementById("sinePeriodInput");
    const sineStatusEl = document.getElementById("sineStatus");
    const statusEl = document.getElementById("status");
    const cmdStatusEl = document.getElementById("cmdStatus");
    const logEl = document.getElementById("log");

    let port = null;
    let reader = null;
    let writer = null;
    let buffer = "";
    let closingSerial = false;
    let connectingSerial = false;
    let lastRxAt = 0;
    let telemTimer = null;
    let posModeEnabled = false;
    let chartRefreshTimer = null;
    const logLines = [];
    const data = [];

    const MAX_POINTS = 600;
    const MAX_LOG_LINES = 300;
    const RX_TIMEOUT_MS = 3000;
    const RX_WATCHDOG_MS = 1000;
    const TELEM_INTERVAL_MS = 50;
    const CHART_REFRESH_MS = 66;

    function clamp(v, min, max) {
      if (!Number.isFinite(v)) return min;
      if (v < min) return min;
      if (v > max) return max;
      return v;
    }

    function normalizeAngleForSlider(deg) {
      if (!Number.isFinite(deg)) return 0;
      const wrapped = deg % 360;
      return wrapped < 0 ? wrapped + 360 : wrapped;
    }

    function syncAngleControls(deg) {
      const sliderDeg = normalizeAngleForSlider(deg);
      angleSlider.value = String(Math.round(sliderDeg));
      angleInput.value = String(Math.round(deg));
    }

    function fmtTime(ts) {
      const d = new Date(ts);
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      const ss = String(d.getSeconds()).padStart(2, "0");
      const ms = String(d.getMilliseconds()).padStart(3, "0");
      return `${hh}:${mm}:${ss}.${ms}`;
    }

    function appendLog(line) {
      logLines.push(`[${fmtTime(Date.now())}] ${line}`);
      if (logLines.length > MAX_LOG_LINES) {
        logLines.splice(0, logLines.length - MAX_LOG_LINES);
      }
      logEl.textContent = logLines.join("\n");
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setSineStatus(text) {
      if (!sineStatusEl) return;
      sineStatusEl.textContent = `Sine: ${text}`;
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function setCmdStatus(text, ok = true) {
      cmdStatusEl.textContent = text;
      cmdStatusEl.classList.toggle("ok", ok);
      cmdStatusEl.classList.toggle("err", !ok);
    }

    function setConnectionState(connected) {
      setStatus(connected ? "Connected" : "Disconnected");
      connectBtn.textContent = connected ? "Disconnect" : "Connect";
      appendLog(connected ? "PORT: connected" : "PORT: disconnected");
    }

    function setModeEnabled(enabled) {
      posModeEnabled = !!enabled;
      modeStatus.textContent = `Mode: ${posModeEnabled ? "enabled" : "disabled"}`;
      startBtn.disabled = posModeEnabled;
      stopBtn.disabled = !posModeEnabled;
    }

    function drawChart() {
      const w = chart.width;
      const h = chart.height;
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = "#263241";
      ctx.lineWidth = 1;
      for (let i = 1; i < 5; i++) {
        const y = (h / 5) * i;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }
      if (data.length < 2) return;

      const last = data[data.length - 1];
      targetVal.textContent = last.target.toFixed(3);
      posVal.textContent = last.pos.toFixed(3);
      outPwmVal.textContent = last.outPwm.toFixed(1);
      outRawVal.textContent = last.outRaw.toFixed(1);
      errVal.textContent = (last.target - last.pos).toFixed(3);

      let minY = data[0].target;
      let maxY = data[0].target;
      for (const p of data) {
        if (p.target < minY) minY = p.target;
        if (p.pos < minY) minY = p.pos;
        if (p.target > maxY) maxY = p.target;
        if (p.pos > maxY) maxY = p.pos;
      }
      if (Math.abs(maxY - minY) < 0.2) {
        maxY += 0.1;
        minY -= 0.1;
      }
      const range = maxY - minY;

      function yScale(v) {
        return h - ((v - minY) / range) * h;
      }

      ctx.strokeStyle = "#4cc9f0";
      ctx.lineWidth = 2;
      ctx.beginPath();
      data.forEach((p, i) => {
        const x = (i / (MAX_POINTS - 1)) * w;
        const y = yScale(p.pos);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      ctx.strokeStyle = "#fca311";
      ctx.lineWidth = 2;
      ctx.beginPath();
      data.forEach((p, i) => {
        const x = (i / (MAX_POINTS - 1)) * w;
        const y = yScale(p.target);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    function appendData(target, pos, outPwm, outRaw) {
      data.push({ target, pos, outPwm, outRaw });
      if (data.length > MAX_POINTS) data.shift();
      if (!chartRefreshTimer) {
        chartRefreshTimer = setTimeout(() => {
          chartRefreshTimer = null;
          drawChart();
        }, CHART_REFRESH_MS);
      }
    }

    function sendLine(text) {
      if (!writer) return;
      const data = new TextEncoder().encode(text + "\n");
      writer.write(data);
    }

    function bindClick(el, handler) {
      if (!el) return false;
      el.addEventListener("click", handler);
      return true;
    }

    function sendTargetDeg(deg) {
      if (!Number.isFinite(deg)) return;
      syncAngleControls(deg);
      sendLine("START PID POS");
      sendLine(`SET PID POS ANGLE ${deg.toFixed(2)}`);
    }

    function stopSineTest(sendCmd = true) {
      if (sendCmd && writer) sendLine("STOP PID POS SINE");
      setSineStatus("stopped");
    }

    function startSineTest() {
      const amp = clamp(parseFloat(sineAmpInput.value), 0, 180);
      const offset = clamp(parseFloat(sineOffsetInput.value), 0, 360);
      const period = clamp(parseFloat(sinePeriodInput.value), 0.5, 60);
      if (!Number.isFinite(amp) || !Number.isFinite(offset) || !Number.isFinite(period)) {
        setCmdStatus("Invalid sine parameters", false);
        return;
      }

      sineAmpInput.value = String(Math.round(amp));
      sineOffsetInput.value = String(Math.round(offset));
      sinePeriodInput.value = period.toFixed(1);

      stopSineTest(false);
      sendLine(`SET PID POS SINE AMP ${amp.toFixed(2)}`);
      sendLine(`SET PID POS SINE OFFSET ${offset.toFixed(2)}`);
      sendLine(`SET PID POS SINE PERIOD ${period.toFixed(2)}`);
      sendLine("START PID POS");
      sendLine("START PID POS SINE");
      setSineStatus(`running (A=${amp.toFixed(0)} O=${offset.toFixed(0)} T=${period.toFixed(1)}s)`);
    }

    function bindNumeric(input, cmdPrefix) {
      if (!input) return;
      input.addEventListener("change", () => {
        const v = parseFloat(input.value);
        if (!Number.isFinite(v)) return;
        sendLine(`${cmdPrefix} ${v}`);
      });
    }

    function handlePosPidLine(parts) {
      if (parts.length < 6) return;
      kpInput.value = String(parseFloat(parts[1]).toFixed(4));
      kiInput.value = String(parseFloat(parts[2]).toFixed(4));
      kdInput.value = String(parseFloat(parts[3]).toFixed(4));
      const targetDeg = parseFloat(parts[4]);
      if (Number.isFinite(targetDeg)) syncAngleControls(targetDeg);
      setModeEnabled(parseInt(parts[5], 10) === 1);
    }

    function handlePosTelemLine(parts) {
      if (parts.length < 5) return;
      const target = parseFloat(parts[1]);
      const pos = parseFloat(parts[2]);
      const outPwm = parseFloat(parts[3]);
      const outRaw = parseFloat(parts[4]);
      if (!Number.isFinite(target) || !Number.isFinite(pos) || !Number.isFinite(outPwm) || !Number.isFinite(outRaw)) return;
      appendData(target, pos, outPwm, outRaw);
    }

    function handlePosSineLine(parts) {
      if (parts.length < 5) return;
      const amp = parseFloat(parts[1]);
      const offset = parseFloat(parts[2]);
      const period = parseFloat(parts[3]);
      const enabled = parseInt(parts[4], 10) === 1;
      if (Number.isFinite(amp)) sineAmpInput.value = String(Math.round(clamp(amp, 0, 180)));
      if (Number.isFinite(offset)) sineOffsetInput.value = String(Math.round(clamp(offset, 0, 360)));
      if (Number.isFinite(period)) sinePeriodInput.value = String(clamp(period, 0.5, 60).toFixed(1));
      if (enabled) {
        setSineStatus(`running (A=${sineAmpInput.value} O=${sineOffsetInput.value} T=${sinePeriodInput.value}s)`);
      } else {
        setSineStatus("stopped");
      }
    }

    function handleLine(line) {
      const isPosTelem = line.startsWith("TP,");
      if (!isPosTelem) appendLog("<< " + line);

      if (line === "OK") {
        setCmdStatus("OK", true);
        return;
      }
      if (line === "ERR") {
        setCmdStatus("ERR", false);
        return;
      }
      if (line.startsWith("PP,")) {
        handlePosPidLine(line.split(","));
        return;
      }
      if (line.startsWith("PS,")) {
        handlePosSineLine(line.split(","));
        return;
      }
      if (isPosTelem) {
        handlePosTelemLine(line.split(","));
      }
    }

    async function readLoop() {
      try {
        while (true) {
          if (!reader) break;
          const { value, done } = await reader.read();
          if (done) break;
          const chunk = new TextDecoder().decode(value);
          if (chunk && chunk.length) lastRxAt = Date.now();
          buffer += chunk;
          let idx;
          while ((idx = buffer.search(/[\r\n]/)) >= 0) {
            const line = buffer.slice(0, idx).trim();
            buffer = buffer.slice(idx + 1);
            if (line.length) handleLine(line);
          }
        }
      } catch (err) {
        if (!closingSerial) appendLog("RX ERROR: " + (err && err.message ? err.message : err));
      } finally {
        if (!closingSerial && (port || reader || writer)) {
          await closeSerial({ logDisconnect: true, reportErrors: false });
        }
      }
    }

    function stopTelem() {
      if (telemTimer) {
        clearInterval(telemTimer);
        telemTimer = null;
      }
    }

    function startTelem() {
      if (!writer || telemTimer) return;
      sendLine("GET TELEM POS");
      telemTimer = setInterval(() => {
        if (writer) sendLine("GET TELEM POS");
      }, TELEM_INTERVAL_MS);
    }

    function releaseSerialHandlesForUnload() {
      stopTelem();
      stopSineTest(false);
      buffer = "";
      if (reader) {
        try { void reader.cancel(); } catch (_err) {}
        try { reader.releaseLock(); } catch (_err) {}
        reader = null;
      }
      if (writer) {
        try { writer.releaseLock(); } catch (_err) {}
        writer = null;
      }
      if (port) {
        const opened = port;
        port = null;
        try { void opened.close(); } catch (_err) {}
      }
      setStatus("Disconnected");
      connectBtn.textContent = "Connect";
    }

    async function closeSerial(options = {}) {
      const { logDisconnect = true, reportErrors = true } = options;
      if (closingSerial) return;
      if (!port && !reader && !writer) {
        if (logDisconnect && statusEl.textContent !== "Disconnected") {
          setConnectionState(false);
        }
        return;
      }
      closingSerial = true;
      connectingSerial = false;
      try {
        stopTelem();
        stopSineTest(false);
        if (reader) {
          try { await reader.cancel(); } catch (_err) {}
          try { reader.releaseLock(); } catch (_err) {}
          reader = null;
        }
        if (writer) {
          try { writer.releaseLock(); } catch (_err) {}
          writer = null;
        }
        if (port) {
          const opened = port;
          port = null;
          try { await opened.close(); } catch (err) {
            if (reportErrors) appendLog("Error: " + (err && err.message ? err.message : err));
          }
        }
        if (logDisconnect) setConnectionState(false);
        else {
          setStatus("Disconnected");
          connectBtn.textContent = "Connect";
        }
      } finally {
        closingSerial = false;
      }
    }

    async function connect(useChooser = true) {
      if (connectingSerial || closingSerial) return;
      connectingSerial = true;
      try {
        if (!("serial" in navigator)) {
          setStatus("Web Serial not supported");
          return;
        }
        if (useChooser) {
          port = await navigator.serial.requestPort();
        } else {
          const ports = await navigator.serial.getPorts();
          if (!ports.length) {
            setStatus("No paired ports");
            return;
          }
          port = ports[0];
        }
        await port.open({ baudRate: 115200 });
        reader = port.readable.getReader();
        writer = port.writable.getWriter();
        setConnectionState(true);
        lastRxAt = Date.now();
        void readLoop();
        sendLine("GET PID POS");
        sendLine("GET PID POS SINE");
        startTelem();
      } catch (err) {
        setStatus("Error: " + (err && err.message ? err.message : err));
        appendLog("Error: " + (err && err.message ? err.message : err));
        await closeSerial({ logDisconnect: false, reportErrors: false });
      } finally {
        connectingSerial = false;
      }
    }

    bindClick(connectBtn, () => {
      if (port) void closeSerial({ logDisconnect: true, reportErrors: true });
      else void connect(true);
    });
    bindClick(getBtn, () => {
      sendLine("GET PID POS");
      sendLine("GET PID POS SINE");
    });
    bindClick(saveBtn, () => sendLine("SAVE PID POS"));
    bindClick(startBtn, () => sendLine("START PID POS"));
    bindClick(stopBtn, () => sendLine("STOP PID POS"));
    bindClick(stopBtn, () => stopSineTest(true));
    bindClick(clearLogBtn, () => {
      logLines.length = 0;
      logEl.textContent = "";
    });

    if (angleSlider) {
      angleSlider.addEventListener("input", () => {
        stopSineTest(true);
        syncAngleControls(parseFloat(angleSlider.value));
      });
    }
    if (angleInput) {
      angleInput.addEventListener("change", () => {
        stopSineTest(true);
        syncAngleControls(parseFloat(angleInput.value));
      });
    }
    bindClick(setAngleBtn, () => {
      stopSineTest(true);
      const deg = parseFloat(angleInput.value);
      if (!Number.isFinite(deg)) return;
      syncAngleControls(deg);
      sendTargetDeg(deg);
    });

    bindClick(sineStartBtn, () => startSineTest());
    bindClick(sineStopBtn, () => stopSineTest(true));

    bindNumeric(kpInput, "SET PID POS KP");
    bindNumeric(kiInput, "SET PID POS KI");
    bindNumeric(kdInput, "SET PID POS KD");
    syncAngleControls(0);

    setModeEnabled(false);

    if ("serial" in navigator) {
      navigator.serial.addEventListener("disconnect", () => {
        void closeSerial({ logDisconnect: true, reportErrors: false });
      });
      setInterval(() => {
        if (port && Date.now() - lastRxAt > RX_TIMEOUT_MS) {
          setCmdStatus("No RX (check COM port)", false);
        }
      }, RX_WATCHDOG_MS);
      window.addEventListener("pagehide", releaseSerialHandlesForUnload);
      window.addEventListener("beforeunload", releaseSerialHandlesForUnload);
      window.addEventListener("unload", releaseSerialHandlesForUnload);
    }
  </script>
</body>
</html>
