[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msg-relay"
version = "0.1.0"
description = "RDK host relay runtime and SDK for ESP modules"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyserial==3.5",
  "pyudev==0.24.1",
  "fastapi==0.115.6",
  "uvicorn==0.32.1",
  "websockets==13.1",
]

[project.scripts]
msg-relay = "msg_relay.run:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
msg_relay = ["web/*", "espressif_devices.json", "espressif_devices.json.bak"]
