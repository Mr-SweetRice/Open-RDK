<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Msg Relay Monitor</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="layout">
      <aside class="panel devices-panel">
        <div class="panel-header">
          <h1>Host Devices</h1>
          <div class="device-header-actions">
            <span id="deviceCount" class="badge">0</span>
            <a href="/color" class="action-btn">Color Studio</a>
            <button id="clearDevices" class="action-btn" type="button">Clear Devices</button>
          </div>
        </div>
        <div id="devices" class="device-list"></div>
      </aside>

      <section class="panel comms-panel">
        <div class="panel-header">
          <h2 id="selectedTitle">Comms Stream</h2>
          <div class="status-row">
            <label class="type-picker" for="messageTypeSelect">
              <span>Type</span>
              <select id="messageTypeSelect" class="type-select"></select>
            </label>
            <label class="type-picker" for="baudRateSelect">
              <span>Baud</span>
              <select id="baudRateSelect" class="type-select"></select>
            </label>
            <label class="type-picker" for="tractionOutValueInput">
              <span>Out %</span>
              <input
                id="tractionOutValueInput"
                class="type-select"
                type="number"
                min="0"
                max="100"
                step="1"
                value="0"
              />
            </label>
            <button id="tractionOutSend" class="action-btn" type="button">OK</button>
            <label class="type-picker" for="cmdInput">
              <span>Cmd</span>
              <input
                id="cmdInput"
                class="type-select"
                type="text"
                value="GET PID RPM"
                spellcheck="false"
                autocomplete="off"
              />
            </label>
            <button id="cmdSend" class="action-btn" type="button">Send</button>
            <button id="telemetryStart" class="action-btn" type="button">Start RX</button>
            <button id="telemetryStop" class="action-btn" type="button">Stop RX</button>
            <button id="clearStream" class="action-btn" type="button">Clear</button>
            <button
              id="autoScrollToggle"
              class="action-btn toggle-btn is-on"
              type="button"
            >
              Auto-scroll: On
            </button>
            <span id="wsStatus" class="status offline">offline</span>
            <span id="eventCount" class="badge">0 lines</span>
          </div>
        </div>
        <div id="commsTable" class="comms-table"></div>
      </section>
    </main>

    <script src="/static/app.js?v=20260406-step4-group2"></script>
  </body>
</html>
